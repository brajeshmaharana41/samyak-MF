<header class="topbar">
  <div class="brand"><i class="pi pi-building-columns"></i> Samyak</div>
  <nav class="actions">
    <a routerLink="/users" class="nav-link"><i class="pi pi-users"></i> Users</a>
    <span class="user"><i class="pi pi-user"></i> {{ user()?.name }}</span>
    <p-button label="Logout" icon="pi pi-sign-out" severity="secondary" [outlined]="true" size="small" (onClick)="logout()" />
  </nav>
</header>

<main class="content">
  <h1>Welcome, {{ user()?.name }}</h1>
  <p class="sub">Choose a module. Each one is a separate micro-frontend, loaded only when you open it.</p>

  <section class="grid">
    @for (m of modules; track m.key) {
      <samyak-module-tile [tile]="m" />
    }
  </section>
</main>
