# Sample nginx config: ONE server hosting the shell and all six remotes.
#
# Two kinds of URL, kept apart on purpose (same as `ng serve` locally):
#
#   PAGES (handled by the shell's Angular router, SPA fallback to index.html)
#     https://samyak.example.in/              -> login / home
#     https://samyak.example.in/brc           -> the shell, with Bank Registration Cell loaded inside it
#     https://samyak.example.in/brc/records/BRC-001
#
#   REMOTE FILES (static JS/CSS/JSON of each separately built module)
#     https://samyak.example.in/remotes/brc/remoteEntry.json   -> dist/bank-registration-cell/browser
#     https://samyak.example.in/remotes/iod/...                -> dist/insurance-operation-department/browser
#
# Deploy flow:
#   npm run build:all
#   node scripts/use-manifest.mjs prod      # writes the prod manifest into dist/shell/browser
#   copy dist/<app>/browser/* to the folders listed at the bottom
#
# Each remote can be redeployed on its own: copy its new files to its folder. No shell rebuild.
# Remote files are loaded relative to their remoteEntry.json, so no base-href change is needed.

server {
    listen 80;
    server_name samyak.example.in;

    gzip on;
    gzip_types application/javascript application/json text/css;

    # ---------------------------------------------------------------
    # Never cache the two "pointer" files, so a redeploy is picked up
    # immediately. Everything else has a content hash in its name and
    # can be cached for a long time.
    # ---------------------------------------------------------------
    location = /federation.manifest.json {
        root /var/www/samyak/shell;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/remotes/(brc|iod|csd|crc|rmc|rbp)/remoteEntry\.json$ {
        root /var/www/samyak;
        add_header Cache-Control "no-cache";
        # Only needed if the shell is served from a DIFFERENT origin than the remotes.
        add_header Access-Control-Allow-Origin "*";
        default_type application/json;
    }

    # ---------------------------------------------------------------
    # Remote files: static only.
    #   /remotes/brc/foo.js -> /var/www/samyak/remotes/brc/foo.js
    # No SPA fallback here: a missing file is a real 404.
    # ---------------------------------------------------------------
    location ~ ^/remotes/(brc|iod|csd|crc|rmc|rbp)/ {
        root /var/www/samyak;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # Shell + SPA fallback: any page URL (/home, /users/U001, /brc,
    # /brc/records/BRC-001 ...) returns index.html and Angular routes it.
    # ---------------------------------------------------------------
    location / {
        root /var/www/samyak/shell;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        root /var/www/samyak/shell;
        add_header Cache-Control "no-cache";
    }
}

# Folder layout on the server:
#   /var/www/samyak/shell/          <- dist/shell/browser/*
#   /var/www/samyak/remotes/brc/    <- dist/bank-registration-cell/browser/*
#   /var/www/samyak/remotes/iod/    <- dist/insurance-operation-department/browser/*
#   /var/www/samyak/remotes/csd/    <- dist/claim-settlement-department/browser/*
#   /var/www/samyak/remotes/crc/    <- dist/complaint-redressal-cell/browser/*
#   /var/www/samyak/remotes/rmc/    <- dist/recovery-management-cell/browser/*
#   /var/www/samyak/remotes/rbp/    <- dist/risk-based-premium/browser/*
